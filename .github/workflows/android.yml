name: Build Android APK

# 云端编译：本机不用装 Android Studio / JDK / SDK
# 触发方式：推到 main/master，或在 Actions 页面手动点 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Capacitor 7 要求 JDK 21
      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装依赖
        run: npm install

      # 第一次跑的时候仓库里还没有 android/，自动生成
      - name: 生成安卓工程（仅首次）
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: 同步网页资源到安卓工程
        run: npx cap sync android

      - name: 编译 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: bubu-workbench-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
